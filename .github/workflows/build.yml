name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU emulator
        run: python -m pip install unicorn==2.1.4
      - name: Configure Windows x86
        run: cmake -S . -B build -A Win32
      - name: Build wrapper and native tests
        run: cmake --build build --config Release
      - name: Test production coordinate transform in Unicorn
        run: python tests/unicorn_viewport.py --report output/unicorn-viewport.json
      - name: Verify DLL version and author
        run: ./tests/test_version.ps1
      - name: Verify preparation and packaging
        run: python -m unittest discover -s tests -p test_*.py -v
      # Native runtime tests require an interactive desktop and a hardware D3D11
      # device. Run build.ps1 locally; hosted CI only verifies their compilation.
      - name: Build end-user archive
        run: python package.py
      - name: Build developer archive
        run: python package.py --developer
      - name: Verify extracted distribution and adjacent DLL import
        run: ./tests/test_distribution.ps1
      - name: Validate release assets and tag (no publishing)
        shell: pwsh
        run: |
          $tag = 'v' + (Get-Content VERSION -Raw).Trim()
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $tag = $env:GITHUB_REF_NAME }
          python tools/release.py --tag $tag
      - uses: actions/upload-artifact@v4
        with:
          name: syw2-ddraw-distributions
          path: |
            output/*.zip
            output/*.zip.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('output/unicorn-viewport.json') != ''
        with:
          name: unicorn-viewport-report
          path: output/unicorn-viewport.json
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: windows-build
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: syw2-ddraw-distributions
          path: output
      - name: Publish verified user ZIP to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python tools/release.py --tag $env:GITHUB_REF_NAME --publish
