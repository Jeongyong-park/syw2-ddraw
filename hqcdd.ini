[Display]
; 0 = resizable window; 1 = borderless fullscreen on the current monitor.
; Alt+Enter switches modes at any time. Aspect ratio is always preserved.
Fullscreen=0
; auto = D3D11 hardware with GDI fallback; gdi = software presentation.
Renderer=gdi
; Leave off initially: the game can present multiple times per logical frame.
VSync=0
; nearest, bilinear (GPU), sharp-bilinear (GPU), integer.
Scaling=nearest
; Legacy fallback if Scaling is absent.
LinearFilter=0
